  <style>
    .cl-origin { transform: translate(180px, 198px); }
    .cl-o-group {
      transform-origin: 0px 0px;
      animation: cl-o-motion 3.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .cl-tray {
      transform-origin: 0px 0px;
      animation: cl-tray-motion 3.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .cl-arrow {
      transform-origin: 0px 0px;
      animation: cl-arrow-motion 3.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .cl-fill-rect {
      animation: cl-fill-wave 3.6s ease-in-out infinite;
    }
    .cl-halo {
      transform-origin: 0px 0px;
      animation: cl-halo-pulse 3.6s ease-in-out infinite;
    }

    @keyframes cl-fill-wave {
      0%   { transform: translateY(62px); }
      26%  { transform: translateY(0px); }
      34%  { transform: translateY(54px); }
      60%  { transform: translateY(0px); }
      84%  { transform: translateY(0px); }
      100% { transform: translateY(62px); }
    }

    @keyframes cl-arrow-motion {
      0%, 10% { transform: translateY(0px) scale(1); filter: none; }
      24%     { transform: translateY(-2.5px) scale(1.03); filter: drop-shadow(0 0 4px rgba(3, 110, 254, 0.35)); }
      35%     { transform: translateY(0px) scale(1); filter: none; }
      58%     { transform: translateY(-2.5px) scale(1.03); filter: drop-shadow(0 0 5px rgba(3, 110, 254, 0.4)); }
      74%     { transform: translateY(-34.0px) scale(1.07); filter: drop-shadow(0 0 11px rgba(3, 110, 254, 0.55)); }
      84%     { transform: translateY(-34.0px) scale(1); filter: none; }
      100%    { transform: translateY(0px) scale(1); filter: none; }
    }

    @keyframes cl-o-motion {
      0%, 58% { transform: translateY(0px) scale(1); }
      75%     { transform: translateY(-23.1px) scale(1.045); }
      84%     { transform: translateY(-23.1px) scale(1); }
      100%    { transform: translateY(0px) scale(1); }
    }

    @keyframes cl-tray-motion {
      0%, 58% { transform: translateY(0px); }
      75%, 84%{ transform: translateY(-7.5px); }
      100%    { transform: translateY(0px); }
    }

    @keyframes cl-halo-pulse {
      0%      { transform: translateY(-6px) scale(0.65); opacity: 0.08; }
      24%     { transform: translateY(-6px) scale(0.86); opacity: 0.24; }
      35%     { transform: translateY(-6px) scale(0.65); opacity: 0.08; }
      58%     { transform: translateY(-6px) scale(0.88); opacity: 0.26; }
      74%     { transform: translateY(-6px) scale(1.22); opacity: 0.42; }
      86%, 100% { transform: translateY(-6px) scale(0.65); opacity: 0.06; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cl-o-group, .cl-tray, .cl-arrow, .cl-fill-rect, .cl-halo {
        animation: none !important;
      }
      .cl-fill-rect { transform: translateY(0px); }
      .cl-halo { opacity: 0; }
    }
  </style>
